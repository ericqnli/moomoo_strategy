# moomoo_strategy config v2.5 (Four-Element + Divergence)
# 密钥请放 .env（见 .env.example），不要写在本文件

symbols:
  - BRK.B
  - SPY
  - QQQ

# 数据设置
ktype: K_DAY
history_days: 250
max_count: 300
poll_interval_sec: 30

# ==================== 四要素策略核心参数 ====================
signal_level: 2                    # 1=强, 2=中(推荐), 3=弱
require_golden_cross: false        # 是否强制MACD金叉
require_both_divergence: false     # True=必须MACD+RSI双背离

rsi_oversell: 40
rsi_overbuy: 60
vol_multiple: 1.5                  # 放量倍数
trend_ma_period: 20                # 趋势过滤均线

# 背离参数（pt2.0 亮点）
diver_bar_count: 20
min_wave_gap: 4
use_macd_divergence: true
use_rsi_divergence: true

enable_trend_filter: true
enable_cycle_resonance: false      # 预留60min共振

# ==================== 原有参数（保留兼容） ====================
rsi_max_for_buy: 46
rsi_min_for_sell: 68
atr_period: 14
atr_mult: 2.0
volume_mult: 0.5
volume_confirm_mult_buy: 0.8
volume_confirm_mult_sell: 1.5
highest_window: 60

# 仓位与风控
initial_cash: 100000               # 账户初始资金（paper）
positions_file: state/positions.json
max_position_pct: 0.30
initial_shares: 50                 # 动态仓位算不出时的兜底股数
stop_loss_atr_multiple: 2.0        # 入场价 - N*ATR 止损
take_profit_ratio: 0.12            # 12% 止盈
take_profit_fraction: 1.0          # 1.0=全平; 0.5=先平一半

# Telegram: 使用环境变量或 .env
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
# （可选兼容字段，勿提交真实 token）
# telegram_bot_token: ""
# telegram_chat_id: ""

trade_mode: paper                  # paper | live（live 实盘下单尚未开放）
