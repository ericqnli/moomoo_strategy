# moomoo_strategy config
# 日线：MA5 上穿 MA10 买 1 份，下穿 MA10 卖 0.5 份，下穿 MA30 全部卖出

# 固定标的，与自选分组合并去重；不要把 OpenD 拉到的名单写回这里
symbols: []
#- BRK.B
#- SPY
#- QQQ

# moomoo 自选自定义分组（名字须与 App 里一致）
watchlist_groups:
  - AI
  - 太空

# 只收这些市场；空列表表示不按市场过滤
watchlist_markets:
  - US

# 自选同步周期（秒）。close 模式下只在当轮执行时拉一次
watchlist_refresh_seconds: 900

ktype: K_DAY
history_days: 520
max_count: 400

# close = 等美股常规收盘后跑一轮并退出
# loop  = 按 sleep_seconds 循环（旧行为）
run_schedule: loop  
close_timezone: America/New_York
close_time: "16:15"
sleep_seconds: 1800

# 收盘价简单均线
ma_fast: 5
ma_mid: 10
ma_slow: 30

# 一份的金额。死叉 MA10 卖其中半份股数，不是把总仓位砍半。
buy_amount: 5000

trade_mode: paper

# 收盘汇总推企业微信（paper / live 都发）
enable_close_report: true

# 通知：企业微信为主，Telegram 默认关
# webhook 放 config.local.yaml
enable_telegram: false
wecom_webhook_url: ""
telegram_bot_token: ""
telegram_chat_id: ""
