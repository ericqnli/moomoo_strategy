# moomoo_strategy config v2.7
# 买卖规则对齐国金 QMT Macd_V1（默认开关与 QMT 一致）

# 固定标的，与自选分组合并去重；不要把 OpenD 拉到的名单写回这里
symbols:
  - BRK.B
  - SPY
  - QQQ

# moomoo 自选自定义分组（名字须与 App 里一致）
watchlist_groups:
  - AI
  - 太空

# 只收这些市场；空列表表示不按市场过滤
watchlist_markets:
  - US

# 自选同步周期（秒）。close 模式下只在当轮执行时拉一次
watchlist_refresh_seconds: 900

ktype: K_DAY
history_days: 400
max_count: 300

# close = 等美股常规收盘后跑一轮并退出
# loop  = 按 sleep_seconds 循环（旧行为）
run_schedule: loop  
close_timezone: America/New_York
close_time: "16:15"
sleep_seconds: 1800

macd_fast: 12
macd_slow: 26
macd_signal: 9

rsi_period: 6
rsi_oversold: 35
kdj_n: 9
kdj_m1: 3
kdj_m2: 3
kdj_k_oversold: 30
kdj_j_oversold: 20
adx_period: 14
adx_trend: 25
adx_range: 20
regime_mode: auto

use_volume_filter: false
volume_mult: 1.2
volume_ma_period: 20

use_stop_loss: false
use_take_profit: false
use_trailing: false
use_time_stop: false
stop_mode: pct
stop_loss_pct: 0.08
take_profit_pct: 0.18
atr_period: 14
stop_atr_mult: 2.0
take_atr_mult: 3.5
trail_pct: 0.08
max_hold_days: 30

div_lookback: 30
div_peak_order: 3
death_cross_sell_ratio: 0.5

enable_repeat_buy: true
max_buy_count: 3
buy_amount: 5000
max_position_pct: 0.35

trade_mode: paper

# 收盘汇总推企业微信（paper / live 都发）
enable_close_report: true

# 通知：企业微信为主，Telegram 默认关
# webhook 放 config.local.yaml
enable_telegram: false
wecom_webhook_url: ""
telegram_bot_token: ""
telegram_chat_id: ""
